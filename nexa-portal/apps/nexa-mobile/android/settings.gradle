pluginManagement {

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(new File(rootDir, ".."))
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json', { paths: [process.cwd()] })] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(new File(rootDir, ".."))
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json', { paths: [process.cwd()] })] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }

  // Shorten pnpm virtual store paths in autolinking.json to avoid Windows MAX_PATH (260 char) errors in Ninja / CMake C++ codegen.
  def autolinkingJson = file("${layout.rootDirectory}/build/generated/autolinking/autolinking.json")
  if (autolinkingJson.exists()) {
    def content = autolinkingJson.text
    def updatedContent = content.replaceAll(/node_modules[\\\/]\.pnpm[\\\/][^\\\/]+[\\\/]node_modules[\\\/]/, "node_modules/")
    if (updatedContent != content) {
      autolinkingJson.text = updatedContent
    }
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Nexa'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
